# Nginx config for Next Chapter.
#
# Update these values before installing:
# - server_name cloud.hatch2web.com;
# - root /var/www/html;
# - fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
#
# Install example:
# sudo cp deploy/nginx-nextchapter.conf /etc/nginx/sites-available/nextchapter
# sudo ln -s /etc/nginx/sites-available/nextchapter /etc/nginx/sites-enabled/nextchapter
# sudo nginx -t
# sudo systemctl reload nginx

server {
    listen 80;
    server_name cloud.hatch2web.com;

    root /var/www/html;
    index index.php index.html;

    # Redirect old Next Chapter .html URLs to clean URLs.
    location ~ ^/nextchapter/(.+)\.html$ {
        return 301 /nextchapter/$1$is_args$args;
    }

    # Next Chapter API routes: /nextchapter/api/session, /nextchapter/api/auth/login, etc.
    # Send every API route directly to the PHP front controller so POST/PUT/DELETE
    # requests are not treated as static-file requests by Nginx.
    location ^~ /nextchapter/api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/nextchapter/api/index.php;
        fastcgi_param SCRIPT_NAME /nextchapter/api/index.php;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    }

    # PHP execution.
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
    }

    # Next Chapter extensionless frontend routes.
    # /nextchapter/pipeline serves /nextchapter/pipeline.html,
    # /nextchapter/responsible-ai serves /nextchapter/responsible-ai.html,
    # and any future /nextchapter/page-name route serves /nextchapter/page-name.html.
    location /nextchapter/ {
        try_files $uri $uri/ $uri.html =404;
    }

    # Block hidden files such as .env and .htaccess.
    location ~ /\.(?!well-known) {
        deny all;
    }
}


