<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>90-Day Responsible AI Governance — Faisal Hoque</title>
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
      <link href="./assets/css/team-chat.css" rel="stylesheet">
      <link href="./assets/css/responsible-ai.css" rel="stylesheet">
   </head>
   <body>
      <button id="sidebarToggle" class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
      <div id="govSidebar" class="sidebar"></div>
      <nav>
         <div class="nav-logo" onclick="go('home')">Responsible AI <span>Governance</span></div>
         <div class="nav-tabs" id="navTabs"></div>
         <div id="navRight"></div>
      </nav>
      <div id="mainContent" class="main-content">
         <div id="app"></div>
      </div>
      <!-- Modal -->
      <div id="modalRoot"></div>
      <!-- Notes FAB -->
      <div id="gchatPanel" class="gchat-panel"></div>
      <button class="gchat-fab" id="gchatFab" onclick="toggleGChat()">&#9824; Team Chat<span class="gchat-unread" id="gchatUnread" style="display:none">0</span></button>
      <!-- Team Chat Panel -->
      <!-- <button class="team-chat-fab" id="teamChatFab" style="display:none" onclick="TeamChat.loadTeams(); document.getElementById('teamChatPanel').style.display='flex'">👥 Teams</button>
      <div class="team-chat-panel" id="teamChatPanel"></div> -->
      <button class="notes-fab" id="notesFab" onclick="toggleNotes()">&#9998; Notes<span class="notes-count" id="notesCount">0</span></button>
      <div class="notes-panel" id="notesPanel"></div>
      <!-- Voice FAB -->
      <button class="voice-fab" id="voiceFab" onclick="toggleVoice()"><span class="voice-fab-icon" id="voiceIcon">&#127908;</span><span id="voiceLabel">Voice</span></button>
      <div class="voice-toast" id="voiceToast"></div>
      <!-- Coach FAB -->
      <div class="coach-fab-pulse" id="fabPulse"></div>
      <button class="coach-fab" id="coachFab" onclick="toggleCoach()">&#10022; AI Coach</button>
      <div class="coach-panel" id="coachPanel"></div>
      <script src="./assets/js/responsible-ai.js"></script>
      <script src="./assets/js/team-chat.js"></script>
      <script src="./assets/js/common.js"></script>
   </body>
</html>
