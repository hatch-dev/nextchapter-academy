<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>90-Day AI Innovation Pipeline — Faisal Hoque</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A1612;--paper:#F5F2EC;--gold:#B8892A;--gold-light:#D4A84B;--gold-pale:#F0E4C4;
  --navy:#0F1B2D;--stone:#8A8278;--rule:rgba(184,137,42,.25);
  --ph1:#1B6B5A;--ph2:#2D5A8E;--ph3:#8B5E3C;--ph4:#9B2D3F;--ph5:#6B4C8A;
  --serif:'Cormorant Garamond',Georgia,serif;--mono:'DM Mono',monospace;--sans:'Helvetica Neue',Arial,sans-serif;
  --font-readable-xs:14px;--font-readable-sm:12px;--font-readable-md:13px;--font-readable-lg:14px;
  --font-control:var(--font-readable-sm);--font-label:var(--font-readable-xs);--font-meta:var(--font-readable-xs);
  --weight-readable:600;--weight-control:700;
  --surface:rgba(245,242,236,.06);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-weight:400;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}
a{color:var(--gold);text-decoration:none;transition:color .2s}a:hover{color:var(--gold-light)}
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.reveal.visible{opacity:1;transform:translateY(0)}
textarea,input,select{color-scheme:dark}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:18px 48px;display:grid;grid-template-columns:minmax(230px,max-content) minmax(0,1fr) max-content;align-items:center;gap:24px;background:rgba(26,22,18,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--rule)}
.nav-logo{font-family:var(--serif);font-size:21px;font-weight:400;letter-spacing:.15em;color:var(--paper);text-transform:uppercase;cursor:pointer;white-space:nowrap;line-height:1.1}
nav>*{min-width:0}
.nav-logo span{color:var(--gold);margin-left:.35em}
.nav-tabs{display:flex;gap:0;list-style:none;justify-content:center;min-width:0;overflow:visible}
#navRight{min-width:0;justify-self:end}
.profile-menu{position:relative;display:flex;justify-content:flex-end}
.profile-trigger{min-width:112px}
.profile-panel{position:absolute;top:calc(100% + 12px);right:0;width:220px;padding:8px;background:rgba(26,22,18,.98);border:1px solid var(--rule);box-shadow:0 18px 44px rgba(0,0,0,.34);display:none}
.profile-panel.open{display:block}
.profile-name{font-family:var(--mono);font-size:var(--font-meta);font-weight:var(--weight-readable);line-height:1.5;color:var(--stone);letter-spacing:.08em;text-transform:uppercase;padding:8px 10px 12px;border-bottom:1px solid var(--rule);margin-bottom:6px;word-break:break-word}
.profile-item{width:100%;border:none;background:none;color:var(--paper);font-family:var(--mono);font-size:var(--font-control);font-weight:var(--weight-control);letter-spacing:.1em;text-transform:uppercase;text-align:left;padding:10px;cursor:pointer}
.profile-item:hover{color:var(--gold);background:rgba(245,242,236,.04)}
.nav-menu{position:relative;display:flex;align-items:center}
.module-panel{position:absolute;top:calc(100% + 12px);left:50%;width:min(360px,calc(100vw - 32px));transform:translateX(-50%);padding:8px;background:rgba(26,22,18,.98);border:1px solid var(--rule);box-shadow:0 18px 44px rgba(0,0,0,.34);display:none}
.module-panel.open{display:block}
.module-item{width:100%;border:none;background:none;color:var(--paper);text-align:left;padding:12px;cursor:pointer;border-bottom:1px solid rgba(245,242,236,.06)}
.module-item:last-child{border-bottom:none}
.module-item:hover:not(:disabled){background:rgba(245,242,236,.04);color:var(--gold)}
.module-item:disabled{cursor:default;opacity:.58}
.module-item-name{font-family:var(--serif);font-size:18px;line-height:1.15;margin-bottom:4px}
.module-item-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:var(--font-meta);font-weight:var(--weight-readable);letter-spacing:.1em;text-transform:uppercase;color:var(--stone)}
.nav-tab{background:none;border:none;font-family:var(--mono);font-size:var(--font-control);font-weight:var(--weight-control);letter-spacing:.1em;text-transform:uppercase;color:var(--stone);padding:8px 16px;cursor:pointer;transition:color .2s;border-bottom:2px solid transparent}
.nav-tab:hover{color:var(--paper)}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.btn-gold{background:var(--gold);color:var(--ink);padding:11px 28px;font-family:var(--sans);font-size:var(--font-control);font-weight:var(--weight-control);letter-spacing:.15em;text-transform:uppercase;border:none;cursor:pointer;transition:background .25s,transform .2s;display:inline-block}
.btn-gold:hover{background:var(--gold-light);transform:translateY(-1px)}
.btn-ghost{border:1px solid rgba(245,242,236,.2);color:var(--paper);padding:10px 24px;font-family:var(--sans);font-size:var(--font-control);font-weight:var(--weight-readable);letter-spacing:.12em;text-transform:uppercase;background:none;cursor:pointer;transition:all .25s;display:inline-block}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-phase{background:none;border:none;cursor:pointer;font-family:var(--sans);padding:10px 20px;font-size:12px;font-weight:600;transition:all .2s;letter-spacing:.05em;text-transform:uppercase}

/* LAYOUT */
.wrap{max-width:1200px;margin:0 auto;padding:0 48px}
.section-label{font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.25em;color:var(--gold);text-transform:uppercase;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.section-label::after{content:'';flex:0 0 28px;height:1px;background:var(--gold)}
.section-title{font-family:var(--serif);font-size:clamp(34px,4vw,58px);font-weight:300;line-height:1.08;margin-bottom:24px}
.section-title em{font-style:italic;color:var(--gold)}
.section-body{font-size:17px;line-height:1.75;color:var(--stone);max-width:580px}

/* CARDS */
.card{background:var(--surface);border:1px solid rgba(245,242,236,.06);position:relative;overflow:hidden;transition:background .4s,border-color .4s,transform .3s}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .4s cubic-bezier(.16,1,.3,1)}
.card:hover{background:rgba(184,137,42,.04);border-color:var(--rule)}
.card:hover::before{transform:scaleX(1)}
.card-link{cursor:pointer}
.card-arrow{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.12em;color:var(--gold);text-transform:uppercase;transition:gap .2s;margin-top:auto}
.card-arrow::after{content:'\u2192'}
.card-link:hover .card-arrow{gap:20px}

/* HERO */

.hero-left{padding:140px 48px 80px;display:flex;flex-direction:column;justify-content:center;gap:32px;position:relative;z-index:1}
.hero-right{padding:140px 48px 80px 0;display:flex;align-items:center;position:relative;z-index:1;justify-content:center}
.hero-eyebrow{font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.hero-headline{font-family:var(--serif);font-size:clamp(52px,6vw,88px);font-weight:300;line-height:.96;color:var(--paper)}
.hero-headline em{font-style:italic;color:var(--gold)}
.hero-sub{font-size:16px;line-height:1.75;color:var(--stone);max-width:480px}
.hero-sub strong{color:var(--paper)}
.hero-btns{display:flex;gap:16px;flex-wrap:wrap}

/* PHASE TIMELINE */
.timeline-wrap{padding:80px 0;border-top:1px solid var(--rule)}
.timeline-phases{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--rule);margin-top:48px}
.timeline-phase{background:var(--ink);padding:32px 24px;cursor:pointer;transition:background .3s}
.timeline-phase:hover,.timeline-phase.active{background:rgba(184,137,42,.04)}
.phase-num{font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
.phase-name{font-family:var(--serif);font-size:22px;font-weight:300;margin-bottom:6px}
.phase-days{font-family:var(--mono);font-size:var(--font-meta);font-weight:var(--weight-readable);letter-spacing:.12em;color:var(--stone);text-transform:uppercase;margin-bottom:16px}
.phase-steps{font-size:var(--font-readable-md);font-weight:500;color:var(--stone);line-height:1.8}

/* CONTENT AREA */
.content-area{padding-top:100px;min-height:100vh}
.content-inner{max-width:900px;margin:0 auto;padding:0 48px 120px}
.step-header{margin-bottom:40px;padding-bottom:32px;border-bottom:1px solid var(--rule)}
.step-eyebrow{font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:12px}
.step-title{font-family:var(--serif);font-size:clamp(32px,4vw,52px);font-weight:300;line-height:1.1}
.step-title em{font-style:italic;color:var(--gold)}
.step-subtitle{font-size:16px;color:var(--stone);line-height:1.75;margin-top:12px;max-width:600px}

/* CONTEXT PANEL */
.ctx-panel{background:rgba(184,137,42,.04);border:1px solid var(--rule);padding:28px 32px;margin-bottom:32px;position:relative;overflow:hidden}
.ctx-panel::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--gold)}
.ctx-insight{font-family:var(--serif);font-size:18px;font-weight:300;line-height:1.55;color:var(--paper);margin-bottom:20px;font-style:italic}
.ctx-stat{font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);color:var(--gold-light);letter-spacing:.06em;line-height:1.6;border-top:1px solid var(--rule);padding-top:16px}
.ctx-source{font-family:var(--mono);font-size:var(--font-meta);font-weight:var(--weight-readable);color:var(--stone);letter-spacing:.1em;text-transform:uppercase;margin-top:8px}

/* MILESTONE */
.milestone-card{background:rgba(184,137,42,.06);border:1px solid var(--rule);padding:20px 24px;margin-top:24px}
.milestone-label{font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.milestone-text{font-size:13px;color:var(--stone);line-height:1.6}

/* FORM ELEMENTS */
.field{margin-bottom:20px}
.field-label{font-family:var(--mono);font-size:var(--font-readable-sm);font-weight:var(--weight-readable);letter-spacing:.12em;text-transform:uppercase;color:var(--stone);margin-bottom:8px;display:block}
.field-input,.field-ta,.field-sel{width:100%;background:rgba(245,242,236,.05);border:1px solid rgba(245,242,236,.12);color:var(--paper);font-family:var(--sans);font-size:15px;padding:12px 16px;outline:none;resize:vertical;transition:border-color .2s;line-height:1.5}
.field-input:focus,.field-ta:focus,.field-sel:focus{border-color:var(--gold)}
.field-ta{min-height:80px}
.field-sel option{background:var(--ink);color:var(--paper)}
.field-input::placeholder,.field-ta::placeholder{color:rgba(138,130,120,.5);font-style:italic}
.likert-wrap{display:flex;align-items:center;gap:10px;margin-top:8px}
.likert-lo,.likert-hi{font-family:var(--mono);font-size:var(--font-meta);font-weight:var(--weight-readable);letter-spacing:.08em;color:var(--stone);text-transform:uppercase;min-width:70px}
.likert-hi{text-align:right}
.likert-btn{width:38px;height:38px;background:none;border:1px solid rgba(245,242,236,.15);color:var(--stone);font-family:var(--mono);font-size:13px;cursor:pointer;transition:all .2s}
.likert-btn:hover{border-color:var(--gold);color:var(--gold)}
.likert-btn.sel{background:var(--gold);border-color:var(--gold);color:var(--ink)}

/* IDEA CARD */
.idea-card{background:rgba(245,242,236,.03);border:1px solid rgba(245,242,236,.08);padding:24px;margin-bottom:12px;transition:all .3s}
.idea-card:hover{background:rgba(184,137,42,.04);border-color:var(--rule)}
.idea-name{font-family:var(--serif);font-size:20px;font-weight:300;margin-bottom:4px}
.gate-row{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.gate-btn{padding:4px 12px;font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:1px solid rgba(245,242,236,.15);background:none;color:var(--stone);transition:all .2s}
.gate-btn.pass{border-color:var(--ph1);color:var(--ph1);background:rgba(27,107,90,.1)}
.gate-btn.fail{border-color:var(--ph4);color:var(--ph4);background:rgba(155,45,63,.1)}
.score-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.score-item{display:flex;flex-direction:column;gap:4px}
.score-label{font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.08em;color:var(--stone);text-transform:uppercase}
.score-input{width:56px;padding:6px;background:rgba(245,242,236,.06);border:1px solid rgba(245,242,236,.12);color:var(--paper);font-family:var(--mono);font-size:13px;text-align:center;outline:none}
.score-input:focus{border-color:var(--gold)}

/* PIPELINE FLOW VIZ */
.pipe-viz{display:flex;gap:0;margin-bottom:32px;background:rgba(245,242,236,.02);border:1px solid var(--rule)}
.pipe-stage{flex:1;padding:16px 20px;border-right:1px solid var(--rule);cursor:pointer;transition:background .2s;position:relative}
.pipe-stage:last-child{border-right:none}
.pipe-stage:hover{background:rgba(184,137,42,.04)}
.pipe-stage.active{background:rgba(184,137,42,.06)}
.pipe-stage-name{font-family:var(--sans);font-size:var(--font-label);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;font-weight:var(--weight-control)}
.pipe-stage-count{font-family:var(--sans);font-size:28px;font-weight:700;line-height:1}

/* PROGRESS */
.step-progress{display:flex;gap:4px;margin-bottom:40px}
.step-pip{height:3px;flex:1;background:rgba(245,242,236,.1);transition:background .4s}
.step-pip.done{background:var(--gold)}
.step-pip.active{background:var(--gold-light)}

/* PORTFOLIO CARDS */
.port-card{border:1px solid rgba(245,242,236,.08);padding:24px;margin-bottom:12px;background:rgba(245,242,236,.02);position:relative}
.port-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.port-card.ph1::before{background:var(--ph1)}
.port-card.ph2::before{background:var(--ph2)}
.port-card.ph3::before{background:var(--ph3)}
.port-card.ph4::before{background:var(--ph4)}
.port-card.ph5::before{background:var(--ph5)}

/* TAGS */
.tag{font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border:1px solid;display:inline-block}
.tag-go{border-color:rgba(27,107,90,.4);color:var(--ph1);background:rgba(27,107,90,.08)}
.tag-nogo{border-color:rgba(155,45,63,.4);color:var(--ph4);background:rgba(155,45,63,.08)}
.tag-exp{border-color:rgba(139,94,60,.4);color:var(--ph3);background:rgba(139,94,60,.08)}
.tag-ops{border-color:rgba(155,45,63,.4);color:var(--ph4);background:rgba(155,45,63,.08)}

/* SIDEBAR NAV (step sub-nav) */
.step-nav{display:flex;gap:0;flex-wrap:wrap;margin-bottom:32px;border:1px solid var(--rule)}
.step-nav-btn{padding:10px 18px;background:none;border:none;font-family:var(--mono);font-size:var(--font-control);font-weight:var(--weight-readable);letter-spacing:.1em;text-transform:uppercase;color:var(--stone);cursor:pointer;transition:all .2s;border-right:1px solid var(--rule)}
.step-nav-btn:last-child{border-right:none}
.step-nav-btn:hover{color:var(--paper)}
.step-nav-btn.active{color:var(--gold);background:rgba(184,137,42,.06)}
.step-nav-btn.done{color:var(--ph1)}

/* SCORE BADGE */
.score-badge{display:inline-flex;flex-direction:column;align-items:center;padding:8px 14px;border:1px solid var(--rule);background:rgba(184,137,42,.04)}
.score-badge-num{font-family:var(--serif);font-size:28px;font-weight:300;color:var(--gold);line-height:1}
.score-badge-den{font-family:var(--mono);font-size:var(--font-meta);font-weight:var(--weight-readable);letter-spacing:.1em;color:var(--stone)}

/* DB BUTTON */
.db-wrap{margin-top:32px;padding-top:24px;border-top:1px solid var(--rule)}

/* COACH FAB */
.coach-fab{position:fixed;bottom:88px;right:32px;z-index:150;height:48px;border-radius:24px;background:var(--gold);border:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:0 22px 0 16px;font-family:var(--mono);font-size:var(--font-control);font-weight:var(--weight-control);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);box-shadow:0 4px 24px rgba(184,137,42,.4);transition:transform .3s,box-shadow .3s}
.coach-fab:hover{transform:translateY(-2px);box-shadow:0 6px 32px rgba(184,137,42,.5)}
.coach-fab.open{transform:scale(0);pointer-events:none}
.coach-fab-pulse{position:fixed;bottom:88px;right:32px;z-index:149;height:48px;width:160px;border-radius:24px;background:var(--gold);opacity:0;animation:fabPulse 2s ease-out infinite}
@keyframes fabPulse{0%{transform:scale(1);opacity:.3}100%{transform:scale(1.4);opacity:0}}
.coach-panel{position:fixed;bottom:88px;right:32px;z-index:160;width:420px;height:600px;max-height:calc(100vh - 100px);background:var(--ink);border:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden;transform:scale(0);transform-origin:bottom right;opacity:0;transition:transform .35s cubic-bezier(.16,1,.3,1),opacity .25s;pointer-events:none;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.coach-panel.open{transform:scale(1);opacity:1;pointer-events:auto}
.coach-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--rule);background:rgba(184,137,42,.04);flex-shrink:0}
.coach-header-title{font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.15em;color:var(--gold);text-transform:uppercase;display:flex;align-items:center;gap:10px}
.coach-close{background:none;border:1px solid rgba(245,242,236,.15);color:var(--stone);width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all .2s}
.coach-close:hover{border-color:var(--gold);color:var(--gold)}
.coach-msgs{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px}
.coach-msg{max-width:88%;line-height:1.6;font-size:15px}
.coach-msg.ai{align-self:flex-start;background:rgba(184,137,42,.06);border:1px solid var(--rule);padding:14px 18px;color:var(--paper)}
.coach-msg.ai .coach-sender{font-family:var(--mono);font-size:var(--font-meta);font-weight:var(--weight-readable);letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin-bottom:6px}
.coach-msg.user{align-self:flex-end;background:rgba(245,242,236,.06);border:1px solid rgba(245,242,236,.1);padding:14px 18px;color:var(--paper)}
.coach-msg.user .coach-sender{font-family:var(--mono);font-size:var(--font-meta);font-weight:var(--weight-readable);letter-spacing:.12em;color:var(--stone);text-transform:uppercase;margin-bottom:6px}
.coach-presets{display:flex;flex-wrap:wrap;gap:6px;padding:12px 24px;border-top:1px solid rgba(245,242,236,.04);flex-shrink:0}
.coach-preset{font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.06em;color:var(--stone);border:1px solid rgba(245,242,236,.1);padding:5px 10px;background:none;cursor:pointer;transition:all .2s;text-transform:uppercase}
.coach-preset:hover{border-color:var(--gold);color:var(--gold)}
.coach-input-row{display:flex;gap:8px;padding:14px 24px;border-top:1px solid var(--rule);background:rgba(26,22,18,.5);flex-shrink:0}
.coach-input-row textarea{flex:1;background:rgba(245,242,236,.05);border:1px solid rgba(245,242,236,.12);color:var(--paper);font-family:var(--sans);font-size:13px;padding:10px 14px;outline:none;resize:none;min-height:40px;max-height:100px;transition:border-color .2s}
.coach-input-row textarea:focus{border-color:var(--gold)}
.coach-input-row textarea::placeholder{color:rgba(138,130,120,.5)}
.coach-send{background:var(--gold);border:none;color:var(--ink);padding:10px 16px;cursor:pointer;font-family:var(--mono);font-size:var(--font-control);font-weight:var(--weight-control);letter-spacing:.08em;transition:background .2s;flex-shrink:0}
.coach-send:hover{background:var(--gold-light)}

/* NOTES FAB */
.notes-fab{position:fixed;bottom:32px;right:32px;z-index:150;height:48px;border-radius:24px;background:var(--ink);border:1px solid var(--rule);cursor:pointer;display:flex;align-items:center;gap:8px;padding:0 20px 0 16px;font-family:var(--mono);font-size:var(--font-control);font-weight:var(--weight-readable);letter-spacing:.1em;text-transform:uppercase;color:var(--stone);transition:all .3s}
.notes-fab:hover{border-color:var(--gold);color:var(--gold)}
.notes-count{background:var(--gold);color:var(--ink);border-radius:10px;padding:1px 6px;font-size:var(--font-meta);font-weight:var(--weight-control);margin-left:4px}
.notes-panel{position:fixed;bottom:32px;right:32px;z-index:160;width:360px;height:520px;background:var(--ink);border:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden;transform:scale(0);transform-origin:bottom right;opacity:0;transition:transform .35s cubic-bezier(.16,1,.3,1),opacity .25s;pointer-events:none}
.notes-panel.open{transform:scale(1);opacity:1;pointer-events:auto}
.notes-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--rule);flex-shrink:0}
.notes-header-title{font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.15em;color:var(--gold);text-transform:uppercase}
.notes-close{background:none;border:1px solid rgba(245,242,236,.15);color:var(--stone);width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all .2s}
.notes-close:hover{border-color:var(--gold);color:var(--gold)}
.notes-list{flex:1;overflow-y:auto;padding:16px 24px;display:flex;flex-direction:column;gap:10px}
.note-card{background:rgba(245,242,236,.04);border:1px solid rgba(245,242,236,.08);padding:12px 16px}
.note-text{font-size:14px;color:var(--paper);line-height:1.6;margin-bottom:6px}
.note-meta{display:flex;justify-content:space-between;align-items:center}
.note-date{font-family:var(--mono);font-size:var(--font-meta);font-weight:var(--weight-readable);color:var(--stone);letter-spacing:.06em}
.note-del{background:none;border:none;color:var(--stone);cursor:pointer;font-size:13px;transition:color .2s}
.note-del:hover{color:var(--ph4)}
.notes-input-row{display:flex;gap:8px;padding:14px 24px;border-top:1px solid var(--rule);flex-shrink:0}
.notes-input-row textarea{flex:1;background:rgba(245,242,236,.05);border:1px solid rgba(245,242,236,.12);color:var(--paper);font-family:var(--sans);font-size:13px;padding:10px 14px;outline:none;resize:none;min-height:40px;max-height:80px}
.notes-input-row textarea:focus{border-color:var(--gold)}
.notes-input-row textarea::placeholder{color:rgba(138,130,120,.5)}
.notes-send{background:var(--gold);border:none;color:var(--ink);padding:10px 14px;cursor:pointer;font-size:16px;flex-shrink:0}
.notes-empty{font-family:var(--serif);font-size:16px;color:var(--stone);font-style:italic;text-align:center;padding:40px 0}

/* MARQUEE */
.marquee-wrap{overflow:hidden;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 0;background:rgba(184,137,42,.02)}
.marquee-track{display:flex;gap:0;animation:marquee 30s linear infinite;width:max-content}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.marquee-item{display:flex;align-items:center;gap:12px;padding:0 28px;font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.15em;text-transform:uppercase;color:var(--stone);white-space:nowrap}
.marquee-dot{width:4px;height:4px;border-radius:2px;background:var(--gold)}

/* GRID */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}

/* COMPLETE */
.complete-bar{background:rgba(27,107,90,.08);border:1px solid rgba(27,107,90,.2);padding:20px 24px;margin-top:24px;display:flex;align-items:center;gap:16px}
.complete-icon{font-family:var(--mono);font-size:18px;color:var(--ph1)}
.complete-text{font-size:13px;color:var(--stone);line-height:1.6}
.complete-text strong{color:var(--paper)}

/* PULLQUOTE */
.pullquote{font-family:var(--serif);font-size:clamp(20px,2.5vw,30px);font-weight:300;line-height:1.5;color:var(--paper);position:relative;padding-left:32px}
.pullquote::before{content:'';position:absolute;left:0;top:4px;bottom:4px;width:2px;background:var(--gold)}
.pullquote cite{display:block;font-family:var(--mono);font-size:var(--font-meta);font-weight:var(--weight-readable);letter-spacing:.15em;color:var(--stone);text-transform:uppercase;margin-top:16px;font-style:normal}

/* SELECT FIX */
select{color:#1a1612 !important;background:rgba(245,242,236,.06)}
select option{color:#1a1612;background:#f5f2ec}
/* SWOT */
.swot-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.swot-cell{padding:16px;background:rgba(245,242,236,.03);border:1px solid rgba(245,242,236,.06)}
.swot-label{font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px}

/* PHASE 5 DASH */
.dash-stat{background:rgba(245,242,236,.03);border:1px solid rgba(245,242,236,.06);padding:24px}
.dash-stat-num{font-family:var(--serif);font-size:48px;font-weight:300;line-height:1}
.dash-stat-label{font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.12em;text-transform:uppercase;color:var(--stone);margin-top:4px}

/* OVERRIDE BTN */
.action-btn{padding:10px 24px;border:1px solid var(--rule);background:none;color:var(--paper);font-family:var(--mono);font-size:var(--font-control);font-weight:var(--weight-readable);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:all .25s}
.action-btn:hover{border-color:var(--gold);color:var(--gold)}
.action-btn.primary{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.action-btn.primary:hover{background:var(--gold-light)}
.action-btn.danger{border-color:rgba(155,45,63,.4);color:var(--ph4)}
.action-btn.danger:hover{background:rgba(155,45,63,.1);border-color:var(--ph4)}
.action-btn:disabled{opacity:.4;cursor:not-allowed}
.action-btn-full{width:100%;padding:14px;font-size:12px}

/* BSH */
.bsh-row{display:flex;gap:8px;margin-top:12px}
.bsh-btn{flex:1;padding:10px;border:1px solid rgba(245,242,236,.12);background:none;font-family:var(--mono);font-size:var(--font-control);font-weight:var(--weight-readable);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--stone);transition:all .2s}
.bsh-btn:hover{border-color:var(--gold);color:var(--gold)}
.bsh-btn.buy{border-color:rgba(27,107,90,.5);color:var(--ph1);background:rgba(27,107,90,.08)}
.bsh-btn.hold{border-color:rgba(139,94,60,.5);color:var(--ph3);background:rgba(139,94,60,.08)}
.bsh-btn.sell{border-color:rgba(155,45,63,.5);color:var(--ph4);background:rgba(155,45,63,.08)}

/* VOICE FAB */
.voice-fab{position:fixed;bottom:212px;right:32px;display:none;z-index:150;height:44px;border-radius:22px;background:var(--surface);border:1px solid var(--rule);cursor:pointer;display:flex;align-items:center;gap:7px;padding:0 18px 0 14px;font-family:var(--mono);font-size:var(--font-control);font-weight:var(--weight-readable);letter-spacing:.1em;text-transform:uppercase;color:var(--stone);box-shadow:0 2px 16px rgba(0,0,0,.2);transition:all .3s}
.voice-fab:hover{border-color:var(--gold);color:var(--gold)}
.voice-fab.listening{background:var(--gold);color:var(--ink);border-color:var(--gold);animation:voicePulse 1.5s infinite}
.voice-fab-icon{font-size:16px;line-height:1}
@keyframes voicePulse{0%,100%{box-shadow:0 0 0 0 rgba(184,137,42,.4)}50%{box-shadow:0 0 0 12px rgba(184,137,42,0)}}
.voice-toast{position:fixed;bottom:270px;right:32px;z-index:160;background:rgba(26,22,18,.96);border:1px solid var(--rule);border-radius:12px;padding:12px 18px;font-family:var(--mono);font-size:12px;color:var(--paper);max-width:320px;box-shadow:0 4px 24px rgba(0,0,0,.3);display:none}
.voice-toast.show{display:block;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.voice-transcript{color:var(--gold);font-style:italic;margin-top:4px;font-family:var(--sans);font-size:13px}
.voice-cmd{color:var(--stone);font-size:var(--font-meta);font-weight:var(--weight-readable);margin-top:6px;line-height:1.5}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(26,22,18,.88);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--ink);border:1px solid var(--rule);padding:40px 48px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto}
.modal h3{font-family:var(--serif);font-size:28px;font-weight:300;margin-bottom:6px}
.modal .sub{font-size:14px;color:var(--stone);margin-bottom:32px;line-height:1.6}

/* RESPONSIVE */
@media(max-width:960px){
nav{padding:14px 20px;grid-template-columns:1fr;gap:8px}.nav-tabs{justify-content:flex-start;overflow:visible}
.hero{grid-template-columns:1fr}.hero-left,.hero-right{padding:100px 24px 40px}.hero-right{display:none}
.wrap{padding:0 24px}.content-inner{padding:0 24px 80px}
.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
.timeline-phases{grid-template-columns:1fr 1fr}
}

/* -- INSIGHTS --------------------------------------------------- */

/* Filter strip */
.insight-filter{
  background:none;
  border:1px solid rgba(253,248,244,.15);
  color:var(--stone);
  font-family:var(--mono);
  font-size:var(--font-control);
  font-weight:var(--weight-readable);
  letter-spacing:.1em;
  text-transform:uppercase;
  padding:6px 14px;
  cursor:pointer;
  border-radius:2px;
  transition:all .2s;
  white-space:nowrap;
}
.insight-filter:hover{border-color:var(--fc,var(--gold));color:var(--fc,var(--gold));}
.insight-filter.active{
  border-color:var(--fc,var(--gold));
  color:var(--fc,var(--gold));
  background:color-mix(in srgb,var(--fc,var(--gold)) 12%,transparent);
}

/* View toggle buttons */
.insight-view-btn{
  background:none;
  border:1px solid rgba(253,248,244,.15);
  color:var(--stone);
  width:32px;
  height:32px;
  border-radius:2px;
  cursor:pointer;
  font-size:14px;
  line-height:1;
  transition:all .2s;
  display:flex;align-items:center;justify-content:center;
}
.insight-view-btn:hover{border-color:var(--gold);color:var(--gold);}
.insight-view-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(200,104,56,.12);}

/* -- Grid card -- */
.insight-card{
  background:rgba(253,248,244,.04);
  border:1px solid rgba(253,248,244,.09);
  padding:22px 20px 18px;
  display:flex;
  flex-direction:column;
  gap:10px;
  cursor:pointer;
  transition:background .25s,border-color .25s,transform .2s;
  position:relative;
  overflow:hidden;
}
.insight-card::after{
  content:'';
  position:absolute;
  bottom:0;left:0;right:0;
  height:2px;
  background:var(--gold);
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .35s cubic-bezier(.16,1,.3,1);
}
.insight-card:hover{background:rgba(253,248,244,.07);border-color:rgba(200,104,56,.28);transform:translateY(-2px);}
.insight-card:hover::after{transform:scaleX(1);}

/* Podcast variant accent bar */
.insight-podcast-bar{height:2px;margin:-4px -20px 4px;opacity:.5;}

.insight-card-header{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.insight-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.08em;text-transform:uppercase;
  padding:3px 9px;border-radius:2px;border:1px solid;white-space:nowrap;
}
.insight-badge svg{flex-shrink:0;}
.insight-date{font-family:var(--mono);font-size:var(--font-meta);font-weight:var(--weight-readable);color:var(--stone);letter-spacing:.06em;white-space:nowrap;}

.insight-title{
  font-family:var(--serif);
  font-size:18px;
  font-weight:300;
  line-height:1.35;
  color:var(--paper);
  flex:1;
}
.insight-title--podcast{font-size:17px;}
.insight-excerpt{font-size:14px;color:var(--stone);line-height:1.7;flex:1;}
.insight-card-foot{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:auto;padding-top:10px;
  border-top:1px solid rgba(253,248,244,.07);
}
.insight-cta{
  font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold);
  transition:letter-spacing .2s;
}
.insight-card:hover .insight-cta{letter-spacing:.2em;}

/* -- List row -- */
.insight-list-row{
  display:grid;
  grid-template-columns:88px 1fr 90px;
  gap:16px;
  align-items:center;
  padding:16px 0;
  border-bottom:1px solid rgba(253,248,244,.07);
  cursor:pointer;
  transition:background .2s;
}
.insight-list-row:hover{background:rgba(253,248,244,.04);}
.insight-list-source{
  font-family:var(--mono);font-size:var(--font-label);font-weight:var(--weight-readable);letter-spacing:.1em;text-transform:uppercase;
  padding:4px 8px;border-radius:2px;border:1px solid;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.insight-list-title{font-family:var(--serif);font-size:17px;font-weight:300;color:var(--paper);line-height:1.3;margin-bottom:4px;}
.insight-list-excerpt{font-size:13px;color:var(--stone);line-height:1.6;}
.insight-list-meta{text-align:right;}

/* === COLLAPSIBLE LEFT SIDEBAR === */
.app-shell{display:flex;height:100vh;overflow:hidden;padding-top:0}
.sidebar{width:260px;background:#242018;border-right:1px solid rgba(200,104,56,.22);display:none;flex-direction:column;flex-shrink:0;transition:width .25s cubic-bezier(.16,1,.3,1);overflow:hidden;position:fixed;top:57px;left:0;bottom:0;z-index:90}
.sidebar.collapsed{width:0}
.sidebar-inner{width:260px;display:flex;flex-direction:column;height:100%;overflow:hidden}
.sidebar-header{padding:16px 18px;border-bottom:1px solid rgba(184,92,42,.15);flex-shrink:0}
.sidebar-logo{font-family:var(--serif);font-size:var(--font-readable-lg);font-weight:400;color:var(--paper);letter-spacing:.08em}
.sidebar-logo span{color:var(--gold)}
.sidebar-scroll{flex:1;overflow-y:auto;padding:8px 0}
.sidebar-scroll::-webkit-scrollbar{width:3px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:rgba(184,92,42,.2);border-radius:2px}
.sidebar-home{padding:8px 16px;font-family:var(--mono);font-size:var(--font-control);font-weight:var(--weight-readable);letter-spacing:.12em;text-transform:uppercase;color:var(--stone);cursor:pointer;transition:all .2s;border-radius:3px;margin:0 6px}
.sidebar-home:hover,.sidebar-home.active{color:var(--paper);background:rgba(196,96,48,.15)}
.sidebar-phase-group{margin-top:8px}
.sidebar-phase-head{padding:6px 16px;display:flex;align-items:center;gap:6px;cursor:pointer;transition:background .2s}
.sidebar-phase-head:hover{background:rgba(245,240,236,.04)}
.sidebar-phase-dot{width:6px;height:6px;border-radius:3px;flex-shrink:0}
.sidebar-phase-name{font-family:var(--mono);font-size:var(--font-control);font-weight:var(--weight-control);letter-spacing:.1em;text-transform:uppercase}
.sidebar-phase-days{font-family:var(--mono);font-size:var(--font-meta);font-weight:var(--weight-readable);color:rgba(138,123,114,.72);margin-left:auto;white-space:nowrap}
.sidebar-step{padding:5px 16px 5px 28px;font-size:var(--font-readable-md);font-weight:500;color:var(--stone);cursor:pointer;transition:all .2s;border-left:2px solid transparent;margin-left:6px}
.sidebar-step:hover{color:var(--paper);background:rgba(245,240,236,.04)}
.sidebar-step.active{color:var(--paper);background:rgba(196,96,48,.15);font-weight:var(--weight-readable)}

function go(page,step){
moduleMenuOpen=false;
// Bridge: handle single-arg calls from pipeline module (go('1.2'), go('out-report'), etc.)
if(step===undefined&&page!=='home'&&page!=='learn'&&page!=='pipeline'&&page!=='insights'&&page!=='phase5'){
  var v=page;
  if(v.match(/^\d+\.\d/)){page='step';step=v;}
  else if(v.indexOf('out-')===0){page='outcome';step=v;}
  else if(v.indexOf('phase-')===0){page='phase';step=v.split('-')[1];}
  else if(v==='nav-bluesky'||v==='nav-explore'||v==='nav-develop'||v==='launch-proj'){page=v;step=null;}
}
currentPage=page;
currentPhase=null;
if(page==='phase'&&step){
  // Phase landing: find phase by ID (1-5), not step ID
  for(var i=0;i<PH.length;i++){if(String(PH[i].id)===String(step)){currentPhase=PH[i];currentStep=String(step);break}}
} else {
  if(step)currentStep=step;else currentStep=null;
  if(currentStep){
    for(var i=0;i<PH.length;i++){
      for(var j=0;j<PH[i].steps.length;j++){if(PH[i].steps[j].id===currentStep){currentPhase=PH[i];break}}
      if(currentPhase)break;
      if(PH[i].outcomes){for(var k=0;k<PH[i].outcomes.length;k++){if(PH[i].outcomes[k].id===currentStep){currentPhase=PH[i];break}}}
      if(currentPhase)break;
    }
  }
}
render();
window.scrollTo(0,0);
}

function getStages(){
  var ideas=data.ideas||[];var sel=data.selected||[];var projects=data.projects||{};
  var review=data.review||{};var launched=data.launched||[];var expSel=data.expSelected||[];
  var operational=[...new Set([...launched,...expSel.filter(i=>((review.items||{})[i]||{}).decision==='buy')])];
  var goProjects=sel.filter(i=>(projects[i]||{}).viable===true);
  var noGoProjects=sel.filter(i=>(projects[i]||{}).viable===false);
  var experiment=expSel.filter(i=>!operational.includes(i));
  var explore=goProjects.filter(i=>!expSel.includes(i)&&!operational.includes(i));
  var pending=sel.filter(i=>!goProjects.includes(i)&&!noGoProjects.includes(i));
  var unselected=ideas.map(function(_,i){return i}).filter(function(i){return!sel.includes(i)});
  var bluesky=[...unselected,...pending];
  return{bluesky,explore,experiment,operational,noGo:noGoProjects};
}

function getScore(idx){
  var a=data.assessments[idx];if(!a)return 0;
  return(a.priority||0)+(a.risk||0)+(a.value||0)+(a.costScore||0)+(a.difficulty||0);
}

function isStepDone(id){
  var cs=data.completedSteps||{};
  if(id==='1.2')return(data.ideas||[]).length>=3;
  if(id==='1.3')return(data.selected||[]).length>0;
  return !!cs[id];
}

function buildInsightCards(filterId,view){
  var allItems=[];
  for(var i=0;i<INSIGHT_FEEDS.length;i++){
    var f=INSIGHT_FEEDS[i];
    if(filterId!=='all'&&f.id!==filterId)continue;
    var items=(insightsData[f.id]&&insightsData[f.id].length>0)?insightsData[f.id]:f.seed;
    for(var j=0;j<items.length;j++){allItems.push({feed:f,item:items[j]});}
  }
  allItems.sort(function(a,b){
    var da=a.item.date?new Date(a.item.date):new Date(0);
    var db=b.item.date?new Date(b.item.date):new Date(0);
    return db-da;
  });

  if(!allItems.length){
    return '<div style="padding:64px;text-align:center;color:var(--stone);font-family:var(--serif);font-size:20px;font-style:italic">No items in this feed.</div>';
  }

  var isList=(view==='list');
  var h=isList
    ? '<div style="display:flex;flex-direction:column;gap:0;margin-top:8px">'
    : '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;margin-top:8px">';

  for(var k=0;k<allItems.length;k++){
    var f2=allItems[k].feed;
    var it=allItems[k].item;
    var isPodcast=(f2.type==='podcast');
    var d=it.date?new Date(it.date):null;
    var ds=d&&!isNaN(d)?d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}):'';
    var url=it.url||f2.profileUrl;
    var excerpt=it.excerpt||'';
    if(excerpt.length>200)excerpt=excerpt.slice(0,197)+'…';

    if(isList){
      h+='<div class="insight-list-row" onclick="window.open(\''+url+'\',\'_blank\')">';
      h+='<div class="insight-list-source" style="color:'+f2.color+';border-color:'+f2.color+'30">'+f2.shortLabel+'</div>';
      h+='<div class="insight-list-body">';
      h+='<div class="insight-list-title">'+(isPodcast?'Audio: ':'')+esc(it.title)+'</div>';
      if(excerpt)h+='<div class="insight-list-excerpt">'+esc(excerpt)+'</div>';
      h+='</div>';
      h+='<div class="insight-list-meta">';
      if(ds)h+='<div style="font-family:var(--mono);font-size:var(--font-label);color:var(--stone)">'+ds+'</div>';
      if(isPodcast&&it.duration)h+='<div style="font-family:var(--mono);font-size:var(--font-label);color:var(--stone);margin-top:3px">Duration: '+esc(it.duration)+'</div>';
      h+='</div>';
      h+='</div>';
    } else {
      h+='<div class="insight-card'+(isPodcast?' insight-card--podcast':'')+'" onclick="window.open(\''+url+'\',\'_blank\')">';
      // Source + date row
      h+='<div class="insight-card-header">';
      h+='<span class="insight-badge" style="background:'+f2.color+'18;color:'+f2.color+';border-color:'+f2.color+'35">'+f2.iconSvg+' '+f2.shortLabel+'</span>';
      if(ds)h+='<span class="insight-date">'+ds+'</span>';
      h+='</div>';
      // Type pip for podcast
      if(isPodcast)h+='<div class="insight-podcast-bar" style="background:'+f2.color+'"></div>';
      // Title
      h+='<div class="insight-title'+(isPodcast?' insight-title--podcast':'')+'">'+(isPodcast?'<span style="color:'+f2.color+'">Audio </span>':'')+esc(it.title)+'</div>';
      // Excerpt
      if(excerpt)h+='<div class="insight-excerpt">'+esc(excerpt)+'</div>';
      // Footer
      h+='<div class="insight-card-foot">';
      if(isPodcast&&it.duration)h+='<span style="font-family:var(--mono);font-size:var(--font-label);color:var(--stone)">Duration: '+esc(it.duration)+'</span>';
      h+='<span class="insight-cta">'+( isPodcast?'Listen':'Read')+' &rarr;</span>';
      h+='</div>';
      h+='</div>';
    }
  }
  h+='</div>';
  return h;
}

function filterInsights(feedId){
  insightsActiveFilter=feedId;
  var btns=document.querySelectorAll('.insight-filter');
  for(var i=0;i<btns.length;i++){btns[i].classList.toggle('active',btns[i].getAttribute('data-feed')===feedId);}
  var grid=document.getElementById('insightGrid');
  if(grid)grid.innerHTML=buildInsightCards(feedId,insightsView);
}

function setInsightView(v){
  insightsView=v;
  var gb=document.getElementById('insightViewGrid');
  var lb=document.getElementById('insightViewList');
  if(gb)gb.classList.toggle('active',v==='grid');
  if(lb)lb.classList.toggle('active',v==='list');
  var grid=document.getElementById('insightGrid');
  if(grid)grid.innerHTML=buildInsightCards(insightsActiveFilter,v);
}

function refreshInsights(){
  insightsLoaded={};
  loadLiveFeeds(true);
}

function updateInsightStatus(msg){
  var el=document.getElementById('insightStatusText');
  if(el)el.textContent=msg;
}

function loadLiveFeeds(force){
  var pending=0;var done=0;var live=0;
  for(var i=0;i<INSIGHT_FEEDS.length;i++){if(INSIGHT_FEEDS[i].rssProxies&&INSIGHT_FEEDS[i].rssProxies.length)pending++;}
  if(!pending){updateInsightStatus('Showing '+_countItems()+' curated items. No live RSS available.');return;}

  function onDone(){
    done++;
    if(done>=pending){
      var total=_countItems();
      updateInsightStatus('Showing '+total+' items · '+live+' source'+(live!==1?'s':'')+' updated live · '+new Date().toLocaleTimeString());
      if(currentPage==='insights'){
        var grid=document.getElementById('insightGrid');
        if(grid)grid.innerHTML=buildInsightCards(insightsActiveFilter,insightsView);
      }
    }
  }

  for(var i=0;i<INSIGHT_FEEDS.length;i++){
    (function(feed){
      if(!feed.rssProxies||!feed.rssProxies.length){return;}
      if(!force&&insightsLoaded[feed.id])return;
      insightsLoaded[feed.id]=true;
      var proxies=feed.rssProxies.slice();

      function tryNext(){
        if(!proxies.length){onDone();return;}
        var url=proxies.shift();
        fetch(url,{signal:AbortSignal.timeout?AbortSignal.timeout(8000):undefined})
          .then(function(r){return r.json();})
          .then(function(json){
            if(json.status==='ok'&&json.items&&json.items.length){
              insightsData[feed.id]=json.items.slice(0,8).map(function(it){
                var raw=it.description||it.content||'';
                var ex=raw.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,220);
                var dur='';
                if(it.itunes_duration){
                  var s=parseInt(it.itunes_duration,10);
                  if(!isNaN(s)&&s>60)dur=Math.floor(s/60)+' min';
                  else if(isNaN(s))dur=it.itunes_duration;
                }
                return{
                  title:(it.title||'').trim(),
                  date:(it.pubDate||it.published||'').slice(0,10),
                  url:it.link||it.guid||feed.profileUrl,
                  excerpt:ex,
                  duration:dur,
                  thumbnail:it.thumbnail||it.enclosure&&it.enclosure.link||''
                };
              });
              live++;
              onDone();
            } else {
              tryNext();
            }
          })
          .catch(function(){tryNext();});
      }
      tryNext();
    })(INSIGHT_FEEDS[i]);
  }

  updateInsightStatus('Fetching live feeds…');
}

function _countItems(){
  var n=0;
  for(var i=0;i<INSIGHT_FEEDS.length;i++){
    n+=((insightsData[INSIGHT_FEEDS[i].id]&&insightsData[INSIGHT_FEEDS[i].id].length)?insightsData[INSIGHT_FEEDS[i].id]:INSIGHT_FEEDS[i].seed).length;
  }
  return n;
}

function fetchLiveInsights(){
  if(insightsState.loading)return;
  insightsState.loading=true;
  var btn=document.getElementById('insightRefreshBtn');
  if(btn){btn.disabled=true;btn.textContent='Fetching\u2026';}
  setInsightStatus('',true);

  // Build one search request per source that has a profileUrl
  // We batch them: ask Claude to search all sources in one call using web_search
  var sourceList=INSIGHT_FEEDS.map(function(f,i){
    return (i+1)+'. '+f.label+' — profile: '+f.profileUrl+(f.feedUrl?' / rss: '+f.feedUrl:'');
  }).join('\n');

  var systemPrompt='You are a research assistant. Use web_search to find the 3–4 most recent public articles, posts, or podcast episodes for each source listed. Return ONLY a JSON object — no markdown, no explanation. Format:\n{\n  "fastco": [{title,date,url,excerpt},...],\n  "psych": [...],\n  "hbr": [...],\n  "mitsloan": [...],\n  "imd": [...],\n  "linkedin": [...],\n  "convergence": [{title,date,url,excerpt,duration},...]\n}\nFor podcasts include duration if found. Excerpts should be 1–2 sentences. Dates as YYYY-MM-DD or YYYY-MM.';

  var userMsg='Find the latest content from Faisal Hoque at these sources:\n'+sourceList+'\n\nReturn only the JSON object described.';

  fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      model:'claude-sonnet-4-6',
      max_tokens:4000,
      system:systemPrompt,
      tools:[{type:'web_search_20250305',name:'web_search'}],
      messages:[{role:'user',content:userMsg}]
    })
  })
  .then(function(r){
    if(!r.ok)throw new Error('API '+r.status);
    return r.json();
  })
  .then(function(data){
    insightsState.loading=false;
    if(btn){btn.disabled=false;btn.innerHTML='\u21bb Refresh Live';}

    // Collect all text blocks from the response (Claude may use tool + then respond)
    var text='';
    if(data.content&&data.content.length){
      for(var i=0;i<data.content.length;i++){
        if(data.content[i].type==='text')text+=data.content[i].text;
      }
    }

    // Extract JSON from response text
    var parsed=null;
    try{
      var s=text.indexOf('{'),e=text.lastIndexOf('}');
      if(s>=0&&e>s)parsed=JSON.parse(text.slice(s,e+1));
    }catch(err){parsed=null;}

    if(parsed){
      var liveCount=0;
      for(var i=0;i<INSIGHT_FEEDS.length;i++){
        var f=INSIGHT_FEEDS[i];
        if(parsed[f.id]&&Array.isArray(parsed[f.id])&&parsed[f.id].length){
          f._live=parsed[f.id].slice(0,6);
          insightsState.liveLoaded[f.id]=true;
          liveCount++;
        }
      }
      _refreshInsightGrid();
      var total=_insightCount('all');
      setInsightStatus('\u2713 '+total+' items \u00b7 '+liveCount+' source'+(liveCount!==1?'s':'')+' live \u00b7 '+new Date().toLocaleTimeString(),false);
    } else {
      setInsightStatus('Live fetch complete. Feed data unavailable \u2014 showing curated content.',false);
    }
  })
  .catch(function(err){
    insightsState.loading=false;
    if(btn){btn.disabled=false;btn.innerHTML='\u21bb Refresh Live';}
    setInsightStatus('Fetch failed ('+err.message+'). Showing curated content.',false);
    console.error('Insights fetch error:',err);
  });
}

function _refreshInsightGrid(){
  var g=document.getElementById('insightGrid');
  if(g)g.innerHTML=buildInsightCards(insightsState.filter,insightsState.view);
}

];

// === VOICE ACTIVATION ===
var voiceActive=false,recognition=null,voiceTimeout=null;

function toggleVoice(){
if(voiceActive){voiceActive=false;if(recognition){try{recognition.stop()}catch(e){}}updateVoiceUI();return;}
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){showVoiceToast('Voice not supported','Use Chrome, Edge, or Safari');return}
recognition=new SR();
recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-US';recognition.maxAlternatives=1;
recognition.onstart=function(){voiceActive=true;updateVoiceUI();showVoiceToast('Listening\u2026','Try: "learn" \u00b7 "pipeline" \u00b7 "navigate" \u00b7 "open coach"')};
recognition.onresult=function(e){
var final='',interim='';
for(var i=0;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript;else interim+=e.results[i][0].transcript}
var display=final||interim;
if(display){var t=$('voiceToast');if(t){t.innerHTML='<div class="voice-transcript">\u201c'+display.trim()+'\u201d</div>';t.classList.add('show')}}
if(final){processVoice(final.trim().toLowerCase())}
};
recognition.onerror=function(e){if(e.error==='not-allowed')showVoiceToast('Microphone blocked','Allow mic access in browser settings');else if(e.error!=='no-speech'&&e.error!=='aborted')showVoiceToast('Error: '+e.error,'')};
recognition.onend=function(){voiceActive=false;recognition=null;updateVoiceUI();clearTimeout(voiceTimeout);voiceTimeout=setTimeout(function(){var t=$('voiceToast');if(t)t.classList.remove('show')},4000)};
try{recognition.start()}catch(e){showVoiceToast('Could not start mic',''+e.message);voiceActive=false;updateVoiceUI()}
}

function updateVoiceUI(){
var fab=$('voiceFab'),lbl=$('voiceLabel');
if(fab){if(voiceActive){fab.classList.add('listening');if(lbl)lbl.textContent='Listening…'}else{fab.classList.remove('listening');if(lbl)lbl.textContent='Voice'}}
var nb=$('navVoiceBtn');
if(nb){if(voiceActive){nb.style.borderColor='var(--gold)';nb.style.color='var(--gold)';nb.textContent='Listening...'}else{nb.style.borderColor='';nb.style.color='';nb.innerHTML='Voice'}}
}

function showVoiceToast(msg,sub){
var t=$('voiceToast');if(!t)return;
t.innerHTML='<div>'+msg+'</div>'+(sub?'<div class="voice-cmd">'+sub+'</div>':'');
t.classList.add('show');
clearTimeout(voiceTimeout);
voiceTimeout=setTimeout(function(){t.classList.remove('show')},6000);
}

function processVoice(text){
var matched=true;
if(text.match(/\b(overview|home|go home|main|start)\b/))go('home');
else if(text.match(/\b(learn|read|research|library|articles?|books?|videos?|podcast)\b/))go('learn');
else if(text.match(/\b(pipeline|phases?|journey|steps?)\b/))go('pipeline');
else if(text.match(/\b(navigate|dashboard|operational|live)\b/))go('phase5');
else if(text.match(/\b(help)\b|how does this work/)){openHelp();showVoiceToast('\u2713 Opening help','')}
else if(text.match(/\b(coach)\b|ask.*coach|open.*coach/)){if(!coachOpen)toggleCoach();showVoiceToast('\u2713 Opening AI Coach','')}
else if(text.match(/\b(notes?)\b|open.*note/)){if(!notesOpen)toggleNotes();showVoiceToast('\u2713 Opening notes','')}
else if(text.match(/\b(close|stop|cancel|never mind|dismiss)\b/)){closeModal();if(coachOpen)toggleCoach();if(notesOpen)toggleNotes();showVoiceToast('Closed','')}
else{matched=false;showVoiceToast('Didn\u2019t catch that','Try: "learn" \u00b7 "pipeline" \u00b7 "coach" \u00b7 "navigate"')}
if(matched&&!text.match(/close|stop|cancel/))showVoiceToast('\u2713 '+text,'');
}

// Init
initApp();

</script>
